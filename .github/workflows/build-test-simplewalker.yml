name: Build and Test Simplewalker

on:
  push:
    paths:
      - .github/workflows/build-test-simplewalker.yml
      - '**.*pp'
      - '**.h'
      - '**CMakeLists.txt'
      - '!microcontroller/**'
      - '!test/microcontroller_tests/**'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ./build
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: sudo apt install -y libeigen3-dev librapidxml-dev libwiringpi-dev
        working-directory: ${{ github.workspace }}
      - run: mkdir build
        working-directory: ${{ github.workspace }}
      - name: Configure cmake
        run: cmake ..

      - name: make test_localization
        run: make test_localization -j$(nproc)
      - name: Upload test_localization
        uses: actions/upload-artifact@v6
        with:
          name: test_localization
          path: ./build/test/test_localization
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: make collect_sensor_cal_data
        run: make collect_sensor_cal_data -j$(nproc)
        continue-on-error: true
      - name: make simplewalker
        run: make simplewalker -j$(nproc)
        continue-on-error: true
      - name: make monitor_only
        run: make monitor_only -j$(nproc)
        continue-on-error: true
      - name: make monitor_controller
        run: make monitor_controller -j$(nproc)
        continue-on-error: true

      - run: make unittest_basic_communication -j$(nproc)
        continue-on-error: true
      - run: make unittest_rotation -j$(nproc)
        continue-on-error: true
      - run: make unittest_leg_kinematics -j$(nproc)
        continue-on-error: true
      - run: make unittest_state_prediction -j$(nproc)
        continue-on-error: true
      - run: make unittest_settings -j$(nproc)
        continue-on-error: true
      - name: Upload unit tests
        uses: actions/upload-artifact@v6
        with:
          name: unit_tests
          path: ./build/test/unittest*
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  run_unit_tests:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: Download unit tests
        uses: actions/download-artifact@v8
        with: { name: unit_tests }
      - run: mkdir data
      - run: chmod +x ./unittest_basic_communication ./unittest_rotation ./unittest_state_prediction ./unittest_leg_kinematics ./unittest_settings
        continue-on-error: true
      - parallel:
        - run: ./unittest_basic_communication
        - run: ./unittest_rotation
        - run: ./unittest_state_prediction
        - run: ./unittest_leg_kinematics
        - run: ./unittest_settings


  test_localization:
    runs-on: ubuntu-24.04-arm
    needs: build
    steps:
      - name: checkout settings
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            settings/settings.xml
            settings/localize_test_settings.xml
          sparse-checkout-cone-mode: false
      - name: Download test_localization
        uses: actions/download-artifact@v8
        with: { name: test_localization }
      - run: mkdir data
      - run: chmod +x ./test_localization
      - name: Run test_localization
        run: ./test_localization >> $GITHUB_STEP_SUMMARY
