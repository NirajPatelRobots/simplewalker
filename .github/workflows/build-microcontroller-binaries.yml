name: Build Microcontroller Binaries

on:
  push:
    paths:
      - .github/workflows/build-microcontroller-binaries.yml
      - microcontroller/**.*pp
      - microcontroller/**.h
      - microcontroller/**CMakeLists.txt
      - communication/communication.*
      - communication/messages.h
      - '!microcontroller/control/**'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: lukstep/raspberry-pi-pico-sdk:latest
    defaults:
      run:
        working-directory: ./microcontroller/build
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            microcontroller
            communication
            sensors
      - run: mkdir microcontroller/build
        working-directory: ${{ github.workspace }}
      - name: Configure cmake
        run: cmake ..
      - name: make calibrate_motor
        run: make calibrate_motor -j$(nproc)
        continue-on-error: true
      - name: make hardware_test
        run: make hardware_test -j$(nproc)
        continue-on-error: true
      - name: make controller_main
        run: make controller_main -j$(nproc)
