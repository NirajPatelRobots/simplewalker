# Run motor calibration with checked-in motor calibration data
name: Calibrate Motor

on:
  push:
    paths:
      - .github/workflows/calibrate-motor.yml
      - data/motortestdata.zip
      - calibrate/calibrate.py
      - calibrate/filter.py
      - calibrate/motor_model.py
      - calibrate/calibrate_cli.py
      - pyproject.toml

jobs:
  calibrate:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        train_filter_cutoff: [0.12]
        test_filter_cutoff: [0.10]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            calibrate/calibrate.py
            calibrate/calibrate_cli.py
            calibrate/filter.py
            calibrate/motor_model.py
            pyproject.toml
            data/motortestdata.zip
          sparse-checkout-cone-mode: false
      - name: Unzip motor test data
        run: unzip -d data/ data/motortestdata.zip
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: calibrate
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*.motortest
          -m static_fric const_opposing_fric
          -T ${{ matrix.train_filter_cutoff }}
          -o data/motorparams >> $GITHUB_STEP_SUMMARY

      - name: test calibration
        if: ${{ matrix.test_filter_cutoff != null }}
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*.motortest
          -T ${{ matrix.test_filter_cutoff }}
          -i data/motorparams >> $GITHUB_STEP_SUMMARY
  ruff_check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            calibrate/*.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: ruff check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: check --output-format=github
          src: "./calibrate"
        continue-on-error: true
