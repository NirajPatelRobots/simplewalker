# Run motor calibration with checked-in motor calibration data
name: Calibrate Motor

on:
  push:
    paths:
      - .github/workflows/calibrate-motor.yml
      - data/motortestdata.zip
      - calibrate/calibrate.py
      - calibrate/filter.py
      - calibrate/motor_model.py
      - calibrate/calibrate_cli.py
      - pyproject.toml

jobs:
  calibrate:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            calibrate/calibrate.py
            calibrate/calibrate_cli.py
            calibrate/filter.py
            calibrate/motor_model.py
            pyproject.toml
            data/motortestdata.zip
          sparse-checkout-cone-mode: false
      - name: Unzip motor test data
        run: unzip -d data/ data/motortestdata.zip
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: calibrate
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*.motortest
          -m static_fric const_fric
          -o data/motorparams >> $GITHUB_STEP_SUMMARY

      - run: echo --- Test calibration @ filter_cutoff = 0.1s ----------------------- >> $GITHUB_STEP_SUMMARY
      - name: Test calibration @ filter_cutoff = 0.1s
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*.motortest -T 0.1
          -i data/motorparams >> $GITHUB_STEP_SUMMARY

      - run: echo --- Test calibration on squares ----------------------------------- >> $GITHUB_STEP_SUMMARY
      - name: Test calibration on squares
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*_squ_*.motortest
          -i data/motorparams >> $GITHUB_STEP_SUMMARY

      - run: echo --- Test calibration on sines ------------------------------------- >> $GITHUB_STEP_SUMMARY
      - name: Test calibration on sines
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*_sin_*.motortest
          -i data/motorparams >> $GITHUB_STEP_SUMMARY

      - run: echo --- Test calibration on deadband ---------------------------------- >> $GITHUB_STEP_SUMMARY
      - name: Test calibration on deadband
        run: >-
          uv run --extra calibration calibrate/calibrate_cli.py data/*_db_*.motortest
          -i data/motorparams >> $GITHUB_STEP_SUMMARY
      - name: Upload calibrated motor parameters
        uses: actions/upload-artifact@v6
        with:
          name: motorparams
          path: ./data/motorparams.learnedparams
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  validate_motor_params:
    needs: calibrate
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            calibrate/filter.py
            calibrate/motor_model.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Download motorparams
        uses: actions/download-artifact@v8
        with: { name: motorparams }
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Validate parameters
        run: uv run --extra calibration calibrate/motor_model.py motorparams

  ruff_check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            calibrate/*.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: ruff check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: check --output-format=github
          src: "./calibrate"
        continue-on-error: true
