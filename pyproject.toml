[project]
name = "simplewalker"
version = "0.1.0"
requires-python = ">=3.11"
description = "Two-legged walking robot"
readme = "README.md"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
calibration = [
    "scipy>=1.13",
]

interactive_calibration = [
    "matplotlib>=3.9",
    "pillow>=9.3",
    "scipy>=1.13",
]


[tool.ruff]
include = ["calibrate/*.py"]
[tool.ruff.lint]
ignore = ["E702",  # Multiple statements on one line
          "F401"   # Unused import
]


[tool.pytest]
minversion = "9.0"
testpaths = ["test/unittests/calibration_unittest.py"]
# other unit tests are unittest framework

[tool.coverage.run]
include = ["calibrate/filter.py", "calibrate/motor_model.py"]
[tool.coverage.report]
[tool.coverage.html]
